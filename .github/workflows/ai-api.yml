name: AI API checks

on:
  pull_request:
    paths:
      - "services/ai_api/**"
      - ".github/workflows/ai-api.yml"
  push:
    branches: [main]
    paths:
      - "services/ai_api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app
      - run: PYTHONPATH=../.. pytest -q tests ../../mlops/training/test_registry.py
      - run: python -m app.evaluation --corpus data/demo_corpus.jsonl --evaluation data/evaluation.example.jsonl
